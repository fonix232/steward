name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: shellcheck
        run: |
          shellcheck -s sh -x .github/scripts/*.sh .github/tests/*.sh
          shellcheck -s sh -e SC2034,SC2154,SC3043 steward-*/files/*.init

  feed:
    name: Feed scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # feed-plan.sh and publish.sh against a throwaway origin, in docker
      # (stand-in packages; no SDK). Under a minute.
      - name: Plan and publish
        run: sh .github/tests/feed-scripts.sh
