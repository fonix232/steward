[workspace]
resolver = "3"
members = ["crates/proto"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/fonix232/steward"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
steward-proto = { path = "crates/proto" }
