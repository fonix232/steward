[workspace]
resolver = "3"
members = ["crates/proto", "crates/tls", "crates/ubus", "steward-agent", "steward-controller"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/fonix232/steward"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: ubus and UCI answers keep their order (UCI sections' order is
# meaningful).
serde_json = { version = "1", features = ["preserve_order"] }
steward-proto = { path = "crates/proto" }
steward-tls = { path = "crates/tls" }
steward-ubus = { path = "crates/ubus" }
# TLS on ring: aws-lc-rs (rustls' default) needs cmake and clang for every target, which the
# OpenWrt SDK build doesn't have.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync", "io-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# The OpenWrt build (rust-package.mk) sets its own release profile: size
# first, LTO, one codegen unit.
